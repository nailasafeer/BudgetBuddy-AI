<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetBuddy AI — Log In</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-wrap">

    <div class="auth-form-side">
      <div class="auth-form">
        <div class="brand">
          <div class="brand-mark">💰</div>
          <div class="brand-name">BudgetBuddy AI</div>
        </div>

        <h1 id="auth-title">Welcome back</h1>
        <p class="sub" id="auth-sub">Track your spending, hit your savings goals, and let AI handle the numbers.</p>
        <div id="auth-message" class="auth-message"></div>

        <form id="auth-form">
          <div class="field" id="name-field" style="display:none;">
            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="Your name">
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="auth-submit" id="auth-submit-btn">Log in</button>
        </form>



        <div class="auth-switch">
          <span id="switch-text">New here?</span>
          <button id="switch-btn">Create an account</button>
        </div>
      </div>
    </div>

    <div class="auth-visual-side">
      <div class="auth-visual-content">
        <h2>Every rupee, accounted for.</h2>
        <p>BudgetBuddy AI categorizes your spending, spots unusual charges, and tells you exactly what you can save this
          month — automatically.</p>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = "https://budgetbuddy-ai-1.onrender.com";
    let isSignup = false;

    document.getElementById("switch-btn").addEventListener("click", () => {
      isSignup = !isSignup;

      document.getElementById("auth-title").textContent =
        isSignup ? "Create your account" : "Welcome back";

      document.getElementById("name-field").style.display =
        isSignup ? "block" : "none";

      document.getElementById("auth-submit-btn").textContent =
        isSignup ? "Create account" : "Log in";

      document.getElementById("switch-text").textContent =
        isSignup ? "Already have an account?" : "New here?";

      document.getElementById("switch-btn").textContent =
        isSignup ? "Log in" : "Create an account";
    });

    document.getElementById("auth-form").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();
        const messageBox = document.getElementById("auth-message");
        messageBox.textContent = "";
        messageBox.classList.remove("show");

        const fullName = document
          .getElementById("name")
          .value
          .trim();

        const email = document
          .getElementById("email")
          .value
          .trim();

        const password = document
          .getElementById("password")
          .value;

        try {
          if (isSignup) {
            const registerResponse = await fetch(
              `${API_BASE}/api/auth/register`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  full_name: fullName,
                  email: email,
                  password: password
                })
              }
            );

            const registerData = await registerResponse.json();

            if (!registerResponse.ok) {
              throw new Error(
                registerData.error || "Registration failed"
              );
            }
            isSignup = false;

            document.getElementById("auth-title").textContent =
              "Welcome back";

            document.getElementById("auth-sub").textContent =
              "Your account was created. Please log in.";

            document.getElementById("name-field").style.display =
              "none";

            document.getElementById("auth-submit-btn").textContent =
              "Log in";

            document.getElementById("switch-text").textContent =
              "New here?";

            document.getElementById("switch-btn").textContent =
              "Create an account";

            event.target.reset();

            messageBox.textContent =
              "Account created successfully. Please log in.";

            messageBox.classList.add("show", "success");

            return;
          }

          const loginResponse = await fetch(
            `${API_BASE}/api/auth/login`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email: email,
                password: password
              })
            }
          );

          const loginData = await loginResponse.json();

          if (!loginResponse.ok) {
            throw new Error(
              loginData.error || "Login failed"
            );
          }

          localStorage.setItem(
            "budgetbuddy_token",
            loginData.access_token
          );

          localStorage.setItem(
            "budgetbuddy_user_name",
            loginData.user.full_name
          );

          window.location.href = "dashboard.html";

        } catch (error) {
          messageBox.textContent = error.message;
          messageBox.classList.add("show");
        }
      }
    );
  </script>

</body>

</html>
